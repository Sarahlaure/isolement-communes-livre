project:
  type: book

book:
  title: "Isolement des communes françaises"
  subtitle: "Mesure des distances aux services de base et cartographie"
  author:
    - name: "Sarah-Laure FOGWOUNG DJOUFACK"
    - name: "Célina NGUEMFOUO NGOUMTSA"
    - name: "Eytan ZAGHROUN"
  language: fr
  repo-url: "https://github.com/Sarahlaure/Projet-de-python-_-Isolement-communes"
  repo-actions: [source]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    background: light
    collapse-level: 1
  chapters:
    - index.qmd
    - introduction.qmd
    - 01-donnees-methodologie.qmd
    - 02-code.qmd
    - 03-statistiques-descriptives.qmd
    - 04-facteurs-isolement.qmd
    - 05-typologie.qmd
    - 06-discussion-conclusion.qmd
  appendices:
    - A-types-bpe.qmd
    - B-depot.qmd
    - C-glossaire.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    toc-title: "Dans ce chapitre"
    number-sections: true
    number-depth: 2
    fig-cap-location: bottom
    tbl-cap-location: top
    lang: fr
    link-external-newwindow: true
    smooth-scroll: true
    code-copy: true
    crossref:
      fig-title: "Figure"
      tbl-title: "Tableau"
      eq-prefix: "équation"
      fig-prefix: "figure"
      tbl-prefix: "tableau"
      chapters: false

# Les blocs de code du livre sont des extraits affichés, pas exécutés :
# les résultats viennent du notebook (data/processed et figures/).
execute:
  freeze: auto
